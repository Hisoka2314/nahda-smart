services:
  postgres:
    image: postgres:16-alpine
    container_name: nahda-smart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nahda
      POSTGRES_PASSWORD: nahda_password
      POSTGRES_DB: nahda_smart
    ports:
      - "5432:5432"
    volumes:
      - nahda_postgres_data:/var/lib/postgresql/data

volumes:
  nahda_postgres_data:
